name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Node.js Dependencies and Start Web App
      working-directory: ./webapp
      run: |
        npm install
        npm start &
        sleep 5  # Wait for server to start
        
    - name: Run Automation Testing (Selenium + Cucumber)
      working-directory: ./automation-testing
      run: mvn test

    - name: Run AI Test Generation Script
      working-directory: ./ai-test-generation
      run: python generate_tests.py

    - name: Run Security Testing Script
      working-directory: ./security-testing
      run: |
        pip install requests
        python security_scanner.py
